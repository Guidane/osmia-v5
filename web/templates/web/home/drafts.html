<section class="card flush">
  <div class="card-head"><h3>Drafts and requests</h3>{% include "web/home/_x.html" %}</div>
  <table class="list">{% for o in draft_orders %}<tr><td><a href="{{ o.get_absolute_url }}">{{ o.number }}</a></td><td>{{ o.vendor|default:"—" }}</td>
    <td><span class="badge">{{ o.get_kind_display }}</span></td><td class="small">{{ o.created_by|default:"" }}</td></tr>
    {% empty %}<tr><td class="empty small">None.</td></tr>{% endfor %}</table>
</section>
