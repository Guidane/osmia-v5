<section class="card flush">
  <div class="card-head"><h3>Active projects</h3>{% include "web/home/_x.html" %}</div>
  <table class="list">{% for p in active_projects %}<tr><td><a href="{{ p.get_absolute_url }}">{{ p }}</a></td><td class="small">{{ p.owner|default:"" }}</td></tr>
    {% empty %}<tr><td class="empty small">None.</td></tr>{% endfor %}</table>
</section>
