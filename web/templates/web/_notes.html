{% load osmia %}{# The Notes card: what is noted of ``owner`` (``notes``), changed in place (✎). #}
<aside class="card notes-card" id="notes" data-notes>
  <div class="notes-head"><h3>Notes</h3>{% if owner %}<button type="button" class="btn small ghost" data-notes-edit title="Change the notes" aria-label="Change the notes">✎</button>{% endif %}</div>
  <p class="notes-text" data-notes-text>{% if notes %}{{ notes|linebreaksbr }}{% else %}<span class="muted small">None.</span>{% endif %}</p>
  {% if owner %}<form method="post" action="{% url 'web:notes' owner|kind owner.pk %}" data-notes-form hidden>{% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <textarea name="notes" aria-label="Notes">{{ notes }}</textarea>
    <div class="notes-actions"><button class="btn small primary">Save</button><button type="button" class="btn small" data-notes-cancel>Cancel</button></div>
  </form>
  <script>
    (function () {
      var card = document.currentScript.closest('[data-notes]'), form = card.querySelector('[data-notes-form]'), shown = card.querySelector('[data-notes-text]');
      function editing(on) { form.hidden = !on; shown.hidden = on; if (on) form.querySelector('textarea').focus(); }
      card.querySelector('[data-notes-edit]').addEventListener('click', function () { editing(form.hidden); });
      card.querySelector('[data-notes-cancel]').addEventListener('click', function () { form.reset(); editing(false); });
    })();
  </script>{% endif %}
</aside>
