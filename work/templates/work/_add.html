  <select name="id" aria-label="{{ label }}" required><option value="">{{ label }}…</option>{% for c in choices %}<option value="{{ c.pk }}">{{ c }}</option>{% endfor %}</select>
  <button class="btn small">Add</button></form>{% endif %}
