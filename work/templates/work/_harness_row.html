<tr><td><a href="{{ h.get_absolute_url }}">{{ h.number }}</a> <span class="small">{{ h.name }}</span>{% if via %} {% include "work/_via.html" %}{% endif %}</td>
  <td class="small"><a href="{{ h.project.get_absolute_url }}">{{ h.project }}</a></td>
  <td><span class="badge{% if h.status == 'released' %} ok{% elif h.status == 'obsolete' %} failed{% endif %}">{{ h.get_status_display }}</span></td>
  <td class="small">{% if h.version %}v{{ h.version }}{% else %}<span class="muted">not saved</span>{% endif %}</td></tr>
